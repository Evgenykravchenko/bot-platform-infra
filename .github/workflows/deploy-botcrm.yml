name: Deploy BotCRM release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published BotCRM version without v (for example 0.7.0)
        required: true
      expected_commit:
        description: Full approved BotCRM commit SHA (40 hexadecimal characters)
        required: true

concurrency:
  group: bot-platform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, bot-platform-prod]
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deploy the approved BotCRM release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BOTCRM_DEPLOY_ROOT: /opt/botcrm
        run: ./scripts/deploy-botcrm.sh "$RELEASE_VERSION" "$EXPECTED_COMMIT"
