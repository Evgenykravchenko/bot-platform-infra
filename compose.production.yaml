services:
  tailscale:
    image: tailscale/tailscale:stable@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    hostname: ${TAILSCALE_HOSTNAME:-bot-content-cms}
    restart: unless-stopped
    depends_on:
      cms-bootstrap:
        condition: service_completed_successfully
    environment:
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 10m
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-bot-content-cms}
      TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [edge]
